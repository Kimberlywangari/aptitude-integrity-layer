# Mounted into the web container in production only. Only the HTTPS proxy can reach that container,
# and it writes the caller's real address into X-Forwarded-For, so nginx may believe the header.
# Without this every candidate would arrive from the proxy's address and share one set of limits.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
