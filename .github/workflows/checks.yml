# Runs the same checks a person runs by hand (README, "Tests"), on every push to main and on every
# pull request, so a broken change shows up before anyone builds on it. The `stack` job runs the
# browser (Playwright) journeys against the whole Compose stack.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: integrity
          POSTGRES_PASSWORD: integrity
          POSTGRES_DB: integrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrity -d integrity_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://integrity:integrity@localhost:5432/integrity_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      # the nine video tests are skipped without ffmpeg, and a skipped test checks nothing.
      # The package mirror sometimes stalls for many minutes (2 of 9 runs on 27 Oct 2026 sat here until
      # the job limit), so apt gets short timeouts and retries, and the step a limit of its own.
      - run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
        timeout-minutes: 5
      # both extras: without `claude` the 7 Claude-client tests are skipped as well
      - run: pip install -e ".[dev,claude]" -c constraints.txt
      - run: ruff check app scripts tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # type-checks (vue-tsc), then builds
      - run: npm run build

  # The base images are pinned by digest and Dependabot proposes newer ones; without this job a bad
  # image bump would pass every check above, because none of them builds an image.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build ./backend
      - run: docker build ./frontend
      # both compose files must still parse (the secrets here are placeholders for the check only)
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: placeholder
          SITE_ADDRESS: localhost
          SESSION_SECRET: placeholder-placeholder-placeholder-1234
          PUBLIC_BASE_URL: https://localhost

  # Each job above passes on its own; this one runs everything together. It builds both images,
  # starts the whole stack as the README says, sets up a sitting, an admin and a made-up cohort, and
  # drives it with a real browser: a candidate's whole journey (Chromium fakes the camera and the
  # microphone), an admin making sittings, a sitting's page and the results screens. The camera gate
  # is on, as it is in production. No mail server is set up, so nothing is sent. Cytonn's questions
  # are not in the repository, so the one browser test that needs them is left out.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRECHECK_GATE: recording
      E2E_BASE_URL: http://localhost:8080
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: ci-only-password-1
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/health
      - name: Practice questions, a sitting with codes, a made-up cohort and an admin
        run: |
          api() { docker compose exec -T api python -m scripts.jobs "$@"; }
          api seed_synthetic --invites /tmp/seed.csv
          # the seeded codes belong to no sitting, so they would all show under the newest one
          docker compose exec -T db psql -U integrity -d integrity -c "update candidates set sitting_id = 1 where sitting_id is null"
          api load_question_bank
          api simulate_cohort --with-emails
          api create_reviewer --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD" --role admin
          api create_invites --sitting 1 --count 2 --out /tmp/codes.csv
          echo "E2E_TOKEN=$(docker compose exec -T api sed -n 2p /tmp/codes.csv | cut -d, -f2)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # apt on the runner sometimes stalls (see the backend job), so short timeouts and retries
      - run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci
          npx playwright install --with-deps chromium
        working-directory: frontend
        timeout-minutes: 8
      - run: npx playwright test --grep-invert cytonn
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color --tail 200
