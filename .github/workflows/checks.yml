# Runs the same checks a person runs by hand (README, "Tests"), on every push to main and on every
# pull request, so a broken change shows up before anyone builds on it. The browser (Playwright)
# journeys need a running stack and stay manual.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: integrity
          POSTGRES_PASSWORD: integrity
          POSTGRES_DB: integrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrity -d integrity_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://integrity:integrity@localhost:5432/integrity_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      # the nine video tests are skipped without ffmpeg, and a skipped test checks nothing.
      # The package mirror sometimes stalls for many minutes (2 of 9 runs on 27 Oct 2026 sat here until
      # the job limit), so apt gets short timeouts and retries, and the step a limit of its own.
      - run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
        timeout-minutes: 5
      # both extras: without `claude` the 7 Claude-client tests are skipped as well
      - run: pip install -e ".[dev,claude]" -c constraints.txt
      - run: ruff check app scripts tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # type-checks (vue-tsc), then builds
      - run: npm run build

  # The base images are pinned by digest and Dependabot proposes newer ones; without this job a bad
  # image bump would pass every check above, because none of them builds an image.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build ./backend
      - run: docker build ./frontend
      # both compose files must still parse (the secrets here are placeholders for the check only)
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: placeholder
          SITE_ADDRESS: localhost
