# The production stack: database, API, worker, web server, and an HTTPS proxy in front. Only the
# proxy is reachable from outside (ports 80 and 443). Settings come from the .env next to this file
# (see .env.example); anything marked required stops `up` with a message when it is missing.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Steps, backups and updates: docs/plan/hosting-cytonn-server.md.

# Docker keeps everything a container prints, forever, unless told otherwise, and on this machine
# that competes with the recordings for the disk. At most 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-env
    # The API refuses to start in production unless the secret, the https address and the recording
    # gate are right, so a mistake here shows up at once.
    ENV: production
    DATABASE_URL: postgresql+psycopg://integrity:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/integrity
    VIDEO_ROOT: /data/video
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
    PRECHECK_GATE: recording
    RETENTION_DAYS: ${RETENTION_DAYS:-30}
    RESUME_WINDOW_S: ${RESUME_WINDOW_S:-172800}
    UNDECIDED_REPORT_DAYS: ${UNDECIDED_REPORT_DAYS:-60}
    # AI. Without a key and without a model on this server, ranking falls back to the rule order.
    AI_PROVIDER: ${AI_PROVIDER:-rules}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_IN_DOCKER:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
    AI_TIMEOUT_S: ${AI_TIMEOUT_S:-150}
    QUESTION_PROVIDER: ${QUESTION_PROVIDER:-ollama}
    QUESTION_OLLAMA_MODEL: ${QUESTION_OLLAMA_MODEL:-qwen3:8b}
    QUESTION_TIMEOUT_S: ${QUESTION_TIMEOUT_S:-300}
    QUESTION_WORKERS: ${QUESTION_WORKERS:-2}
    QUESTION_WAIT_LIMIT_S: ${QUESTION_WAIT_LIMIT_S:-600}
    QUESTION_PAPER_TIMEOUT_S: ${QUESTION_PAPER_TIMEOUT_S:-1800}
    QUESTION_SOLVES: ${QUESTION_SOLVES:-2}
    CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Email (invitations and results). Empty SMTP_HOST means mail waits in the queue.
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Cytonn Aptitude Test}
    # Cytonn's question bank, read by `fetch_cytonn_bank`.
    APTITUDE_API_BASE_URL: ${APTITUDE_API_BASE_URL:-https://hr.cytonn.com/api/aptitude}
    APTITUDE_API_KEY: ${APTITUDE_API_KEY:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - videodata:/data/video

services:
  db:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: integrity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity -d integrity"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # nginx writes the caller's address as the last X-Forwarded-For entry.
      TRUST_FORWARDED_FOR: "true"

  worker:
    <<: *backend
    command: ["python", "-m", "scripts.jobs", "loop"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./deploy/real-ip.conf:/etc/nginx/real-ip.conf:ro
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    logging: *logging
    ports:
      # Leave HTTP_PORT and HTTPS_PORT unset on a real server. They exist for a machine whose 80 or
      # 443 is already taken.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (the host name candidates open)}
      # Who may reach the staff console and its API. The default is everybody; see deploy/Caddyfile.
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  videodata:
  caddydata:
  caddyconfig:
