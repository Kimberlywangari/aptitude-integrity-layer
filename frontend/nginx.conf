# One origin for the page and the API. TLS is not terminated here: docker-compose.prod.yml puts a
# Caddy proxy with HTTPS in front of this container (the camera needs HTTPS everywhere except
# localhost), and that proxy adds Strict-Transport-Security.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API refuses a chunk over CHUNK_MAX_BYTES (5 MB) with a JSON error the page understands.
    # This limit sits just above it, so only something that is not a chunk ever meets nginx's
    # own (HTML) 413. Request buffering stays on: nginx takes a slow upload in full before the
    # API sees it, so a weak connection never holds an API worker.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The invitation code is in the address (?t=), so no other site is ever told the address.
    # Camera, microphone and full screen are for this page only.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self), geolocation=(), payment=()" always;

    # Empty here. In production the compose file mounts a file that trusts the HTTPS proxy in front,
    # so the candidate's real address (not the proxy's) is what the API's limits count.
    include /etc/nginx/real-ip.conf;

    # Docker's own DNS, asked again every few seconds: the API can be restarted (a new image, a
    # crash) without nginx holding on to its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited by every proxied location below. The API reads the last X-Forwarded-For entry
    # (the one added here) as the candidate's address for its attempt limits.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A reviewer's recording. Not buffered, so a seek is answered as the file is read (the API
    # honours Range), and left open long enough for the first open to join the chunks with ffmpeg.
    location ~ ^/api/review/candidates/[^/]+/video$ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # "Try the writer" waits for a model to write a question and check it, which on a slow computer
    # takes minutes. Only this one address is given the time.
    location = /api/admin/ai-questions/sample {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_read_timeout 600s;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_read_timeout 120s;
    }

    # Built files carry a hash in their name, so they never change under the same name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself is always fetched fresh, so a new build is picked up on the next visit.
    location = /index.html {
        expires -1;
    }

    # Every other address is a page of the app (/precheck, /review, ...); the router decides.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
